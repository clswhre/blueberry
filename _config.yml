# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Europe/Kyiv

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: clswhre`s blog # the main title

tagline: Linux, DevSecOps & Engineering Notes # Змінено: Додав більш технічний і влучний опис замість дефолтного

description: >- # used by seo meta and the atom feed
  A technical blog documenting infrastructure experiments, networking security, and "Learn in Public" journey. # Змінено: Відображає твою реальну мету.

# Fill in the protocol & hostname for your site.
url: "https://clswhre.github.io" # ВАЖЛИВО: Заповнено URL твого GitHub Pages.

github:
  username: clswhre # change to your GitHub username

social:
  # Change to your full name.
  name: Bohdan Kryzhov # Змінено: Підставив твоє повне ім'я з посилання на LinkedIn.
  email: # ТУТ_НАПИШИ_СВІЙ_EMAIL (або видали цей рядок, якщо не хочеш світити пошту)
  links:
    - https://github.com/clswhre # change to your GitHub homepage
    - https://www.linkedin.com/in/bohdan-kryzhov-a4895439a/

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings (Поки залишаємо порожнім, можна додати пізніше)
analytics:
  google:
    id: 
  goatcounter:
    id: 
  umami:
    id: 
    domain: 
  matomo:
    id: 
    domain: 
  cloudflare:
    id: 
  fathom:
    id: 

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
theme_mode: dark # Змінено: Примусово увімкнув темну тему (для Linux/DevSecOps блогу це мастхев).

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: "https://avatars.githubusercontent.com/clswhre" # Змінено: Тепер блог автоматично підтягуватиме твою аватарку з GitHub!

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: 

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider: # Поки вимкнено. Коли захочеш додати коментарі, рекомендую 'giscus' (він працює через GitHub Discussions).
  disqus:
    shortname: 
  utterances:
    repo: 
    issue_term: 
  giscus:
    repo: 
    repo_id:
    category:
    category_id:
    mapping: 
    strict: 
    input_position: 
    lang: 
    reactions_enabled: 

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: 
    env: 

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache
    deny_paths:

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------
# (Всю решту файлу залишаємо без змін, вона стандартна для рушія Jekyll)

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
